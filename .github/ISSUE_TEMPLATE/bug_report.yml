name: 问题反馈
description: 报告使用中遇到的问题
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？预期结果是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现问题
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 版本、部署方式、操作系统和浏览器
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请先移除密码、取件码等敏感信息。
