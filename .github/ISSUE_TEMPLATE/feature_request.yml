name: 功能建议
description: 提出改进或新功能
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到的问题
      description: 这个建议要解决什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的方案
      description: 描述期望的使用方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他信息
      description: 可补充替代方案或示例。
